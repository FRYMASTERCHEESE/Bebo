background:#e4f6e6;border-color:#a9d2ae}.bad{background:#fbe3e6;border-color:#e3a6aa}.profile-art{padding:22px;text-align:center;background:var(--banner,linear-gradient(120deg,#ffb9d0,#d32f69,#702857));color:white;font-size:24px;font-weight:bold;min-height:112px;text-shadow:0 1px 2px #222}.avatar{height:116px;width:116px;object-fit:cover;border:3px solid white;box-shadow:0 0 0 1px #bbb;background:#efbfd6;margin:auto;display:grid;place-items:center;font-size:43px;font-weight:bold;color:#872f54}.friends{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}.friend{padding:8px 3px;border:1px solid #eee;font-size:12px;overflow-wrap:anywhere}.friend img{width:48px;height:48px;object-fit:cover}.skin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.skin{border:1px solid #ccc;background:white;text-align:left;padding:5px}.swatch{height:75px;margin-bottom:8px}.actions{display:flex;gap:4px;flex-wrap:wrap;align-items:center}.small{font-size:12px}.footer{padding:20px;text-align:center;font-size:12px;color:#666}.hidden{display:none!important}.hero{max-width:580px;margin:20px auto}.status{min-height:18px;margin:10px 0;color:#a0203b;overflow-wrap:anywhere}.status.ok{color:#176637}.inlineform{display:flex;gap:7px;flex-wrap:wrap}.inlineform .field{flex:1;min-width:150px}.photo{width:95px;height:95px;object-fit:cover;border:2px solid #fff;box-shadow:0 0 0 1px #bbb}@media(max-width:700px){.cols{grid-template-columns:1fr}.head{align-items:flex-start}.brand{font-size:44px}.nav button{padding:10px}.friends{grid-template-columns:repeat(4,minmax(0,1fr))}.hero{margin:0 auto}}
/* Compact 2000s modules, responsive to mouse and touch. */
.retro-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px}
.top16{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.top-slot{border:1px solid #e5c7d4;padding:5px 2px;text-align:center;font-size:11px;min-width:0}
.top-slot a{display:block;overflow-wrap:anywhere}
.top-initial{display:grid;place-items:center;width:38px;height:38px;background:#dba1c5;color:#692247;font-size:21px;font-weight:bold;margin:2px auto 5px;border:2px solid white;outline:1px solid #cc9bba}
.top-slot button{padding:2px 5px;font-size:11px;margin:0}
.big-luv{color:#ae1e4f;font-size:21px;font-weight:bold}
.drawing-tools{display:flex;align-items:center;gap:12px}
.drawing-tools label{display:flex;gap:8px;align-items:center}
#bebo-draw,.drawing-preview{display:block;width:100%;max-width:450px;height:auto;aspect-ratio:5/2;background:white;border:2px solid #bd7390;touch-action:none}
.drawing-preview{border:1px solid #ddd;margin:8px 0;pointer-events:none}
.video-frame{position:relative;width:100%;aspect-ratio:16/9}
.video-frame iframe{width:100%;height:100%;border:0}
audio{width:100%;max-width:100%}
.quiz-option{padding:7px;border-bottom:1px dashed #ddd}
.correct{color:green;font-weight:bold}
.wrong{color:#ab2040;font-weight:bold}
.longtext{white-space:pre-wrap;overflow-wrap:anywhere}
.retro-feed{display:grid;gap:8px}
@media(max-width:700px){.retro-grid{grid-template-columns:1fr}.top16{grid-template-columns:repeat(4,minmax(0,1fr))}.top-slot .actions{justify-content:center}}

.themed-profile{padding:9px;border:1px solid var(--retro-primary,#ad2d52);background:var(--retro-secondary,#f7bdd0)}
.themed-profile .panel{border-color:var(--retro-primary,#ad2d52)}
.themed-profile .panel h2{background:var(--retro-primary,#a52144)}
.themed-profile .profile-art{border:2px solid #fff;outline:1px solid var(--retro-primary,#ad2d52);margin-bottom:16px}

.classic-home{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px}.classic-home .panel h2{background:linear-gradient(#e47e9c,#bd2b5b)}
@media(max-width:700px){.classic-home{grid-template-columns:1fr}}
/* Authentic-ish late-2000s Bebo atmosphere — original CSS and accessibility-respecting controls. */
:root{background:#e4e7eb;color:#292929}
body{background:repeating-linear-gradient(90deg,#edf0f3 0,#edf0f3 13px,#e8eaef 13px,#e8eaef 14px);min-width:320px}
.top{background:linear-gradient(#c83a53,#a81b35);border-bottom:2px solid #701727}
.head{padding:7px 10px 6px}
.brand{font-family:Arial,sans-serif;font-size:49px;line-height:1.07;color:#fff;letter-spacing:-5px;text-shadow:2px 2px 0 #771b35}
.nav{background:linear-gradient(#36383b,#13171c);border-bottom:4px solid #7b9bb6;box-shadow:0 2px 5px #aeb8c1}
.nav .wrap{display:flex;flex-wrap:wrap;align-items:center}
.nav button{border-right:1px solid #52555a;padding:10px 9px;font-size:12px;color:#fff;text-shadow:0 1px #151515}
.nav button:hover,.nav button:focus-visible{background:#bd2d4b;color:#fff}
main.wrap{max-width:1010px;background:#fff;min-height:80vh;border-left:1px solid #c3c9cf;border-right:1px solid #c3c9cf;box-shadow:0 2px 10px #d5d8de}
.panel{border:1px solid #bac7d3;margin-bottom:12px;box-shadow:0 1px 0 #e0e7ee}
.panel h2,.panel h3{background:linear-gradient(#dd7391,#c83160);border-bottom:2px solid #9f1e4f;padding:8px 10px;font:700 14px Verdana,Arial,sans-serif;letter-spacing:.04px}
.panel .body{padding:12px}
.themed-profile{background:linear-gradient(120deg,var(--retro-secondary,#f7c3d3),#fff 55%,var(--retro-secondary,#f7c3d3))}
.themed-profile .panel h2{background:linear-gradient(180deg,var(--retro-secondary,#efbbd3),var(--retro-primary,#bf3769));border-bottom:2px solid var(--retro-primary,#a73566);color:#fff}
.themed-profile .panel .body{background:rgba(255,255,255,.94)}
.profile-art{display:flex;justify-content:center;align-items:center;min-height:140px;background-position:center;background-size:cover}
.classic-modules{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.classic-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px;margin:15px 0}
.classic-photo{background:#fff;border:1px solid #d5dbe3;padding:5px;text-align:center;font-size:11px;word-break:break-word}
.classic-photo img{display:block;width:100%;height:130px;object-fit:cover;margin-bottom:6px}
.classic-mail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.other-half{background:#fff1f5;padding:12px;border:1px dashed #d7819a;font-size:18px;text-align:center;font-weight:bold}
.classic-entry{background:#f7d6e5!important;color:#9d1d45!important}
.classic-entry a{color:#922049}
.safety-profile{border-top:1px dotted #d7bac6;margin:10px 0;padding-top:8px}
.themed-profile .top-slot{background:rgba(255,255,255,.9)}
.footer{margin:0 auto;max-width:1010px;background:#f5f7f9}
@media(max-width:720px){
 .head{gap:9px}
 .brand{font-size:43px}
 .head p{font-size:10px}
 .nav .wrap{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}
 .nav button{flex:0 0 auto;padding:10px 12px;white-space:nowrap}
 .classic-modules,.classic-mail-grid{grid-template-columns:1fr}
 .classic-gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
 main.wrap{padding:13px 10px!important}
}


/* 2007-style Skin Shop: 56 original CSS designs with real mini profile previews. */
.skins-intro{display:flex;justify-content:space-between;gap:16px;align-items:center;border:1px solid #efc1d3;background:linear-gradient(105deg,#fff1f8,#f3d9ed);padding:13px;margin-bottom:12px}
.skins-intro strong{font-size:16px;color:#922953}
.skins-intro p{margin:5px 0 0;line-height:1.5}
.skins-intro>span{flex:0 0 auto;font:italic 19px Georgia,serif;color:#b12a65}
.skin-controls{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:8px 0}
.skin-search-label{display:block;width:min(100%,360px);font-weight:bold;font-size:12px;color:#853c64}
.skin-search-label input{display:block;width:100%;margin-top:6px;border:1px solid #b9a3b8;border-radius:2px;background:#fff;padding:10px}
.skin-filters{display:flex;flex-wrap:wrap;gap:6px;padding:7px 0 15px}
.skin-filter{padding:8px 11px;border:1px solid #bfc5d1;background:#fff;color:#675a65;cursor:pointer;font-weight:bold;font-size:11px}
.skin-filter:hover,.skin-filter.active{background:#ba2959;border-color:#8c2047;color:white}
#skin-gallery.skin-grid{grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:12px}
.skin-card{border:1px solid #d7c2d1;background:#fff;padding:6px;box-shadow:0 2px 2px #e6e0e6;text-align:center}
.skin-card[hidden]{display:none!important}
.skin-preview-button{background:none;border:0;padding:0;display:block;width:100%;color:inherit;cursor:pointer;text-align:left}
.skin-preview-button:focus-visible{outline:3px solid #b93b6c;outline-offset:2px}
.skin-preview-button strong{display:block;font-size:12px;margin:8px 3px 2px;color:#79284d}
.skin-category-name{display:block;font-size:10px;color:#867789;margin:0 3px 6px}
.skin-card .skin-use-button{font-size:11px;width:calc(100% - 6px);padding:7px 3px;background:linear-gradient(#cc5680,#a72554);border-color:#912248;margin:4px 3px}
.skin-card:hover{border-color:#c55482;box-shadow:0 3px 9px #bd80a050;transform:translateY(-1px)}
.skin-mini{border:1px solid #aaa8b1;background:#fff;width:100%;overflow:hidden}
.skin-mini-banner{height:86px;display:flex;align-items:end;position:relative;isolation:isolate;overflow:hidden;padding:8px;color:#fff;text-shadow:0 1px 3px #24172d}
.skin-mini-banner:before{content:attr(data-motif);position:absolute;right:10px;top:-12px;opacity:.55;font-size:70px;line-height:1.4;transform:rotate(-18deg);pointer-events:none}
.skin-mini-banner span{position:relative;font:bold 15px Georgia,serif}
.skin-mini-layout{background:#faf8fa;padding:7px;display:grid;grid-template-columns:42px 1fr;grid-template-rows:28px 14px;gap:5px;min-height:63px}
.skin-mini-avatar{grid-row:1/3;background:linear-gradient(135deg,#ffe4f2,#f7adc8);border:2px solid white;outline:1px solid #c5b4bf;color:#c54475;display:flex;align-items:center;justify-content:center;font-size:23px}
.skin-mini-lines{display:grid;gap:5px;align-content:center}
.skin-mini-lines span{display:block;height:5px;background:#dcd1df}
.skin-mini-lines span:last-child{width:75%}
.skin-mini-blocks{display:flex;gap:5px}
.skin-mini-blocks span{height:12px;flex:1;opacity:.78}
.skin-tryout{max-width:680px;margin:0 auto 20px;background:#f9f7fa;border:1px solid #bbabb9;padding:10px;box-shadow:0 3px 8px #bfafbd30}
.skin-tryout-banner{min-height:115px;position:relative;display:flex;align-items:end;overflow:hidden;padding:14px;color:#fff;font:28px Georgia,serif;text-shadow:0 1px 3px #222}
.skin-tryout-banner::before{content:attr(data-motif);font-size:110px;line-height:1.1;position:absolute;right:25px;top:-15px;opacity:.45;transform:rotate(-16deg)}
.skin-tryout-banner strong{position:relative}
.skin-tryout-flex{display:grid;grid-template-columns:110px 1fr;gap:12px;margin-top:10px}
.skin-tryout-left{display:grid;align-content:start;justify-items:center;gap:6px;font-size:11px;color:#766c78}
.skin-tryout-avatar{width:75px;height:75px;background:linear-gradient(145deg,#f9c7dc,#ffedf4);color:#bf4074;font-size:42px;display:grid;place-items:center;border:4px solid white;outline:1px solid #d5b6c7}
.skin-tryout-main{background:#fff;border:1px solid #e2d5df}
.skin-tryout-main p{padding:3px 10px;font-size:11px;color:#666}
.skin-tryout-bar{color:#fff;font-weight:bold;padding:5px 10px;font-size:12px}
.skin-tryout-caption{display:flex;gap:12px;justify-content:space-between;margin:10px 2px 2px;color:#713050;font-size:12px}
.skin-tryout-caption span{color:#968099}
.themed-profile .profile-art{position:relative;overflow:hidden;isolation:isolate}
.themed-profile .profile-art::before{content:attr(data-decor);position:absolute;right:8%;top:-21px;font-size:125px;transform:rotate(-19deg);opacity:.28;text-shadow:none;pointer-events:none}
.themed-profile .profile-art{font-family:Georgia,Verdana,serif;letter-spacing:1px}
.themed-profile .panel h2{background:linear-gradient(135deg,var(--retro-primary,#ab2953),var(--retro-dark,#612145));border-bottom:2px solid var(--retro-dark,#612145);text-shadow:0 1px 2px #0005}
.themed-profile .panel{box-shadow:0 2px 3px #12091918}
@media(max-width:750px){#skin-gallery.skin-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.skins-intro>span{display:none}.skin-tryout-flex{grid-template-columns:80px minmax(0,1fr)}.skin-tryout-avatar{width:62px;height:62px}.skin-tryout-banner{font-size:24px;min-height:100px}}
@media(max-width:375px){#skin-gallery.skin-grid{grid-template-columns:1fr 1fr;gap:7px}.skin-mini-banner{height:68px}.skin-filters{gap:4px}.skin-filter{padding:7px}.skin-card{padding:4px}}


/* One-step safe editing: the profile picture and all profile fields save together. */
.profile-photo-editor{padding:12px;border:1px solid #d7b2c9;background:#fff5fa;margin:14px 0}
.profile-photo-editor .photo-current{display:flex;justify-content:flex-start;align-items:center;padding:8px 0}
.profile-photo-editor .photo-current .avatar{width:88px;height:88px;object-fit:cover}
.profile-photo-editor strong{color:#9a2a57}
.profile-photo-editor .muted{font-size:12px;line-height:1.55}
.edit-profile-error{display:block;margin:10px 0}

/* Classic Bebo 2007 profile layout — no member content, photos or skins are overwritten. */
.bebo-2007-profile {
  --bebo-paper:rgba(255,255,255,.97);
  width:100%;max-width:100%;min-width:0;
  padding:12px;border:1px solid var(--retro-primary,#ad2b57);
  background:repeating-linear-gradient(90deg,#ffffff2c 0 3px,transparent 3px 22px),var(--retro-secondary,#f5dce5);
  color:#2e2530;
  box-shadow:0 4px 12px #572f472c;
}
.bebo-2007-profile .panel {
  margin:0 0 12px;min-width:0;
  border:1px solid #bf9bae;background:var(--bebo-paper);
  box-shadow:0 2px 4px #2f17251b;
}
.bebo-2007-profile .panel h2 {
  margin:0;padding:9px 11px;
  font:bold 13px Verdana,Arial,sans-serif;
  background:linear-gradient(to bottom,var(--retro-primary,#c83966),var(--retro-dark,#6b284c));
  border-bottom:2px solid var(--retro-dark,#682043);color:#fff;
  text-shadow:0 1px 1px #351e35;
}
.bebo-2007-profile .panel .body {padding:12px;background:var(--bebo-paper)}
.bebo-2007-profile .profile-art.bebo-profile-cover {
  display:flex;align-items:flex-end;justify-content:flex-start;
  min-height:185px;margin:0;
  padding:16px 24px;
  border:3px solid #fff;
  outline:1px solid var(--retro-dark,#6b284c);
  background:var(--banner,linear-gradient(110deg,#ffcadc,#c03b6d,#6f2556));
  background-position:center;background-size:cover;
  overflow:hidden;isolation:isolate;position:relative;
  box-shadow:inset 0 -70px 65px #250c2669;
}
.bebo-2007-profile .bebo-cover-copy {position:relative;z-index:1;text-align:left;overflow-wrap:anywhere}
.bebo-2007-profile .bebo-cover-copy h1 {
  margin:6px 0;font:700 clamp(25px,4vw,37px)/1.15 Georgia,Verdana,serif;
  letter-spacing:.2px;color:white;text-shadow:0 2px 3px #32112b;
}
.bebo-cover-kicker,.bebo-cover-bottom {display:block;font:700 12px Verdana,Arial,sans-serif;letter-spacing:1px;color:#fff}
.bebo-cover-bottom {font-style:italic;letter-spacing:.4px}
.bebo-identity-strip {
  display:grid;grid-template-columns:minmax(110px,1fr) minmax(0,1.8fr) auto;
  align-items:center;gap:12px;
  margin:9px 0 0;padding:10px 14px;
  background:linear-gradient(#fff,#f9edf5);
  border:1px solid #bca0af;border-left:5px solid var(--retro-primary,#c83966);
  box-shadow:0 1px 0 #fff;
}
.bebo-nameplate {min-width:0}
.bebo-nameplate strong {display:block;font:bold 22px Georgia,Verdana,serif;overflow-wrap:anywhere;color:var(--retro-dark,#64284b)}
.bebo-nameplate>span {display:block;font:11px Verdana,Arial,sans-serif;color:#755b70;margin-top:4px}
.bebo-status-line {min-width:0;overflow-wrap:anywhere}
.bebo-current-mood {margin:0;color:#443845;font-size:12px;line-height:1.5}
.bebo-current-mood span {display:block;font-size:10px;font-weight:bold;letter-spacing:.5px;color:#9e436c}
.bebo-profile-actions {display:flex;gap:5px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.bebo-profile-actions .bebo-profile-action,.bebo-profile-buttons .button {
  padding:8px 10px;font:bold 11px Verdana,Arial,sans-serif;
  background:linear-gradient(#fff,#f2e5ef);
  border:1px solid #ba94aa;color:var(--retro-dark,#742b54);
  text-decoration:none;white-space:normal;border-radius:2px;box-shadow:0 1px 1px #c8bbc6;
}
.bebo-profile-buttons {display:flex;flex-wrap:wrap;gap:5px}
.bebo-mini-nav {
  display:flex;gap:0;min-width:0;
  margin:9px 0 14px;
  border:1px solid #244764;
  border-bottom:3px solid #254865;
  background:linear-gradient(#6695b6,#33678e);
  box-shadow:0 2px 0 #ffffff70;
}
.bebo-mini-nav a {
  display:flex;align-items:center;justify-content:center;
  flex:1;min-width:0;padding:10px 8px;
  border-right:1px solid #c6d6e652;
  color:#fff;font:700 12px Verdana,Arial,sans-serif;
  text-decoration:none;white-space:nowrap;text-shadow:0 1px 1px #203b55;
}
.bebo-mini-nav a[aria-current="page"],.bebo-mini-nav a:hover,.bebo-mini-nav a:focus-visible {background:linear-gradient(#dd477c,#af2857);color:#fff}
.bebo-profile-layout {
  display:grid;grid-template-columns:235px minmax(0,1fr);
  gap:13px;align-items:start;min-width:0;
}
.bebo-profile-sidebar,.bebo-profile-main {min-width:0}
.bebo-profile-sidebar {display:block}
.bebo-photo-frame {
  display:grid;place-items:center;
  min-height:195px;margin:2px 0 10px;padding:12px;
  border:1px solid #c4b6bd;background:#fff;
  box-shadow:inset 0 0 0 5px #f2ecf1;
}
.bebo-photo-frame>.avatar {display:grid;width:165px;height:165px;max-width:100%;margin:0;object-fit:contain;background:#fff;border:4px solid white;outline:1px solid #b6a0ac;box-shadow:0 2px 4px #aaa5}
.bebo-photo-frame img.avatar {display:block}
.bebo-profile-handle {margin:5px 0;color:#874160;font:700 12px Verdana,Arial,sans-serif;text-align:center}
.bebo-profile-place {margin:7px 0;color:#665765;font-size:12px;text-align:center}
.bebo-profile-about-module .bebo-about-text {
  font-size:12px;line-height:1.65;
  white-space:pre-wrap;overflow-wrap:anywhere;
}
.bebo-profile-about-module .bebo-about-meta {border-top:1px dotted #c9a6b7;margin-top:10px;padding-top:9px;font-size:12px}

/* Classic Bebo News (2007-inspired): pink frames, readable bulletin header and mobile-friendly expand/collapse. */
.bebo-announcement-strip[hidden] {display:none!important}
.bebo-announcement-strip{
 width:min(calc(100% - 20px),990px);
 max-width:990px;margin:12px auto 0;padding:7px;
 border:1px solid #a83762;
 background:repeating-linear-gradient(90deg,#ffddeb 0,#ffddeb 8px,#ffeaf3 8px,#ffeaf3 16px);
 box-shadow:0 3px 8px #4e1a3826;
}
.bebo-announcement-inner{
 padding:0;border:2px solid #fff;background:#fff;
 outline:1px solid #d29bb4;
}
.bebo-announcement-head{
 position:relative;overflow:hidden;
 padding:10px 15px 13px;
 background:linear-gradient(180deg,#da5b89 0%,#ac285c 52%,#701a46 100%);
 border-bottom:3px solid #682040;
 text-align:center;
}
.bebo-announcement-head::before,.bebo-announcement-head::after{
 position:absolute;top:6px;content:"♥";font-size:28px;opacity:.55;color:#fff;
 pointer-events:none
}
.bebo-announcement-head::before{left:11px}
.bebo-announcement-head::after{right:11px}
.bebo-announcement-tag{
 display:block;margin:0 0 5px;
 font:700 11px/1.5 Verdana,Arial,sans-serif;letter-spacing:1.3px;
 color:#fff6ca;text-shadow:0 1px 2px #44152e;
}
.bebo-announcement-title{
 display:block;position:relative;z-index:1;
 font:700 clamp(17px,3vw,25px)/1.32 Georgia,Verdana,serif!important;
 color:#fff!important;
 text-shadow:0 2px 3px #4d1436;
 overflow-wrap:anywhere;
}
.bebo-announcement-content{
 padding:12px 16px;background:#fff;
 border-top:1px solid #f9d2e5;
 font-size:13px;line-height:1.55;color:#45333e;
}
.bebo-announcement-content .bebo-announcement-preview{
 margin:0 0 6px;color:#45333e;
 white-space:normal;overflow-wrap:anywhere;
}
.bebo-announcement-details{margin:5px 0 0;border-top:1px dotted #dba6bf;padding:8px 0 0}
.bebo-announcement-details summary{
 display:list-item;width:fit-content;
 padding:3px 5px;cursor:pointer;
 font-weight:700;color:#7d2755;
 text-decoration:underline;
 text-underline-offset:3px;
}
.bebo-announcement-details summary:hover,.bebo-announcement-details summary:focus-visible{color:#aa2458}
.bebo-announcement-details summary:focus-visible{outline:2px solid #296caa;outline-offset:3px}
.bebo-announcement-full{
 border:1px solid #e6bfd1;background:#fff7fb;
 margin-top:9px;padding:12px;
 white-space:pre-wrap;overflow-wrap:anywhere;color:#332833;
 font-size:13px;line-height:1.7;
}
.bebo-announcement-details[open] + .bebo-announcement-preview{display:none}
/* A published item's text must be white on dark, not dark maroon on a pink gradient. */
.bebo-admin-page .admin-announcement-card{padding:14px;border:1px solid #d5a8bc;background:#fff}
.bebo-admin-page .admin-announcement-card h3{
 display:flex;flex-wrap:wrap;gap:9px;align-items:center;
 margin:0 0 11px;padding:12px 14px;
 border:1px solid #792149;border-bottom:3px solid #5d1939;
 background:linear-gradient(180deg,#d45181,#ad2e62 56%,#84244e);
 font:700 16px/1.4 Verdana,Arial,sans-serif;
 color:#fff!important;text-shadow:0 1px 2px #4d1231;
 overflow-wrap:anywhere;
}
.bebo-admin-page .admin-announcement-card h3 small{
 display:inline-block;padding:3px 9px;
 background:#fff;color:#67364e!important;
 border:1px solid #fff;border-radius:13px;
 font:700 11px/1.5 Verdana,Arial,sans-serif;
 text-shadow:none;letter-spacing:.2px;
}
.bebo-admin-page .admin-announcement-card .admin-long-text{
 color:#342934;font-size:13px;line-height:1.65;
}
@media(max-width:700px){
 .bebo-announcement-strip{margin:8px auto 0;padding:5px;width:calc(100% - 20px)}
 .bebo-announcement-head{padding:10px 28px 12px}
 .bebo-announcement-head::before,.bebo-announcement-head::after{font-size:18px}
 .bebo-announcement-head::before{left:6px}
 .bebo-announcement-head::after{right:6px}
 .bebo-announcement-content{padding:11px 12px}
 .bebo-admin-page .admin-announcement-card h3{font-size:14px;padding:10px}
}

/* Touchscreen fix: prevent regular Bebo words being selected on smaller screens.
   A width rule works in Chrome Android and embedded browser views, including
   devices where pointer/hover media queries don't report reliably.
   Keep desktop text selection and editing fields functional. */
@media screen and (max-width: 900px) {
  .top, .top *,
  .nav, .nav *,
  #bebo-announcement-bar, #bebo-announcement-bar *,
  #app, #app *,
  .footer, .footer * {
    -webkit-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none;
  }
  #app input, #app textarea, #app select,
  #app [contenteditable], #app [contenteditable] *,
  #app [role="textbox"], #app [role="textbox"] * {
    -webkit-user-select: text !important;
    user-select: text !important;
    -webkit-touch-callout: default;
  }
  /* Do not disable pointer interaction: links, buttons, Whiteboard and canvas stay usable. */
}
