<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Bebo — make your own colourful profile, create skins, find friends and leave wall comments. Independent nostalgic community project.">
<title>Bebo — Your Profile. Your Skin. Your Friends.</title>
<style>
:root{font:14px Verdana,Arial,sans-serif;color:#323232;background:#e9e9ec}*{box-sizing:border-box}body{margin:0}a{color:#155b90;cursor:pointer}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.wrap{width:min(100%,1000px);margin:auto;padding:0 10px}.top{background:#b51e32;color:#fff;border-bottom:4px solid #871326}.head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 10px}.brand{font:bold 54px Arial;color:white;letter-spacing:-5px;text-shadow:0 2px #862035}.brand span{color:#ffbcd1}.head p{font-size:12px;margin:0}.nav{background:linear-gradient(#669bc4,#2f6595);border-bottom:3px solid #244d73}.nav .wrap{display:flex;flex-wrap:wrap}.nav button{background:none;border:0;color:white;padding:12px 17px;font-weight:bold;border-right:1px solid #8bb5d1}.nav button:hover{background:#265582}main{padding:18px 10px!important;min-height:67vh}.panel{background:white;border:1px solid #ccc;margin:0 0 15px}.panel h2,.panel h3{margin:0;background:linear-gradient(#dc3d62,#a52144);color:white;font-size:15px;padding:9px 12px}.body{padding:14px}.muted{font-size:12px;color:#6c6c6c}.cols{display:grid;grid-template-columns:265px minmax(0,1fr);gap:16px}.item{border-bottom:1px solid #e6e6e6;padding:10px 0;overflow-wrap:anywhere}.item:last-child{border:0}.button{padding:9px 15px;background:#3273a6;border:1px solid #1c517d;color:white;font-weight:bold;border-radius:3px;margin:3px 4px 3px 0}.button.secondary{background:#f3f5f7;color:#225a87;border-color:#bccbd6}.button.danger{background:#a02840}.fields{display:grid;gap:11px}.fields label{display:grid;gap:5px;font-weight:bold}.fields input,.fields textarea,.fields select,.field{width:100%;padding:9px;border:1px solid #b6bdc7;border-radius:2px;background:white;color:#272727}.fields input[type="checkbox"]{width:auto;vertical-align:middle}.fields textarea{min-height:80px}.notice{background:#fff5d4;padding:12px;margin-bottom:16px;border:1px solid #e5ce88}.good{background:#e4f6e6;border-color:#a9d2ae}.bad{background:#fbe3e6;border-color:#e3a6aa}.profile-art{padding:22px;text-align:center;background:var(--banner,linear-gradient(120deg,#ffb9d0,#d32f69,#702857));color:white;font-size:24px;font-weight:bold;min-height:112px;text-shadow:0 1px 2px #222}.avatar{height:116px;width:116px;object-fit:cover;border:3px solid white;box-shadow:0 0 0 1px #bbb;background:#efbfd6;margin:auto;display:grid;place-items:center;font-size:43px;font-weight:bold;color:#872f54}.friends{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}.friend{padding:8px 3px;border:1px solid #eee;font-size:12px;overflow-wrap:anywhere}.friend img{width:48px;height:48px;object-fit:cover}.skin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.skin{border:1px solid #ccc;background:white;text-align:left;padding:5px}.swatch{height:75px;margin-bottom:8px}.actions{display:flex;gap:4px;flex-wrap:wrap;align-items:center}.small{font-size:12px}.footer{padding:20px;text-align:center;font-size:12px;color:#666}.hidden{display:none!important}.hero{max-width:580px;margin:20px auto}.status{min-height:18px;margin:10px 0;color:#a0203b;overflow-wrap:anywhere}.status.ok{color:#176637}.inlineform{display:flex;gap:7px;flex-wrap:wrap}.inlineform .field{flex:1;min-width:150px}.photo{width:95px;height:95px;object-fit:cover;border:2px solid #fff;box-shadow:0 0 0 1px #bbb}@media(max-width:700px){.cols{grid-template-columns:1fr}.head{align-items:flex-start}.brand{font-size:44px}.nav button{padding:10px}.friends{grid-template-columns:repeat(4,minmax(0,1fr))}.hero{margin:0 auto}}
/* Compact 2000s modules, responsive to mouse and touch. */
.retro-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px}
.top16{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.top-slot{border:1px solid #e5c7d4;padding:5px 2px;text-align:center;font-size:11px;min-width:0}
.top-slot a{display:block;overflow-wrap:anywhere}
.top-initial{display:grid;place-items:center;width:38px;height:38px;background:#dba1c5;color:#692247;font-size:21px;font-weight:bold;margin:2px auto 5px;border:2px solid white;outline:1px solid #cc9bba}
.top-slot button{padding:2px 5px;font-size:11px;margin:0}
.big-luv{color:#ae1e4f;font-size:21px;font-weight:bold}
.drawing-tools{display:flex;align-items:center;gap:12px}
.drawing-tools label{display:flex;gap:8px;align-items:center}
#bebo-draw,.drawing-preview{display:block;width:100%;max-width:450px;height:auto;aspect-ratio:5/2;background:white;border:2px solid #bd7390;touch-action:none}
.drawing-preview{border:1px solid #ddd;margin:8px 0;pointer-events:none}
.video-frame{position:relative;width:100%;aspect-ratio:16/9}
.video-frame iframe{width:100%;height:100%;border:0}
audio{width:100%;max-width:100%}
.quiz-option{padding:7px;border-bottom:1px dashed #ddd}
.correct{color:green;font-weight:bold}
.wrong{color:#ab2040;font-weight:bold}
.longtext{white-space:pre-wrap;overflow-wrap:anywhere}
.retro-feed{display:grid;gap:8px}
@media(max-width:700px){.retro-grid{grid-template-columns:1fr}.top16{grid-template-columns:repeat(4,minmax(0,1fr))}.top-slot .actions{justify-content:center}}

.themed-profile{padding:9px;border:1px solid var(--retro-primary,#ad2d52);background:var(--retro-secondary,#f7bdd0)}
.themed-profile .panel{border-color:var(--retro-primary,#ad2d52)}
.themed-profile .panel h2{background:var(--retro-primary,#a52144)}
.themed-profile .profile-art{border:2px solid #fff;outline:1px solid var(--retro-primary,#ad2d52);margin-bottom:16px}

/* Authentic-ish late-2000s Bebo atmosphere — original CSS and accessibility-respecting controls. */
:root{background:#e4e7eb;color:#292929}
body{background:repeating-linear-gradient(90deg,#edf0f3 0,#edf0f3 13px,#e8eaef 13px,#e8eaef 14px);min-width:320px}
.top{background:linear-gradient(#c83a53,#a81b35);border-bottom:2px solid #701727}
.head{padding:7px 10px 6px}
.brand{font-family:Arial,sans-serif;font-size:49px;line-height:1.07;color:#fff;letter-spacing:-5px;text-shadow:2px 2px 0 #771b35}
.nav{background:linear-gradient(#36383b,#13171c);border-bottom:4px solid #7b9bb6;box-shadow:0 2px 5px #aeb8c1}
.nav .wrap{display:flex;flex-wrap:wrap;align-items:center}
.nav button{border-right:1px solid #52555a;padding:10px 9px;font-size:12px;color:#fff;text-shadow:0 1px #151515}
.nav button:hover,.nav button:focus-visible{background:#bd2d4b;color:#fff}
main.wrap{max-width:1010px;background:#fff;min-height:80vh;border-left:1px solid #c3c9cf;border-right:1px solid #c3c9cf;box-shadow:0 2px 10px #d5d8de}
.panel{border:1px solid #bac7d3;margin-bottom:12px;box-shadow:0 1px 0 #e0e7ee}
.panel h2,.panel h3{background:linear-gradient(#dd7391,#c83160);border-bottom:2px solid #9f1e4f;padding:8px 10px;font:700 14px Verdana,Arial,sans-serif;letter-spacing:.04px}
.panel .body{padding:12px}
.themed-profile{background:linear-gradient(120deg,var(--retro-secondary,#f7c3d3),#fff 55%,var(--retro-secondary,#f7c3d3))}
.themed-profile .panel h2{background:linear-gradient(180deg,var(--retro-secondary,#efbbd3),var(--retro-primary,#bf3769));border-bottom:2px solid var(--retro-primary,#a73566);color:#fff}
.themed-profile .panel .body{background:rgba(255,255,255,.94)}
.profile-art{display:flex;justify-content:center;align-items:center;min-height:140px;background-position:center;background-size:cover}
.classic-modules{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.classic-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px;margin:15px 0}
.classic-photo{background:#fff;border:1px solid #d5dbe3;padding:5px;text-align:center;font-size:11px;word-break:break-word}
.classic-photo img{display:block;width:100%;height:130px;object-fit:cover;margin-bottom:6px}
.classic-mail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.other-half{background:#fff1f5;padding:12px;border:1px dashed #d7819a;font-size:18px;text-align:center;font-weight:bold}
.classic-entry{background:#f7d6e5!important;color:#9d1d45!important}
.classic-entry a{color:#922049}
.safety-profile{border-top:1px dotted #d7bac6;margin:10px 0;padding-top:8px}
.themed-profile .top-slot{background:rgba(255,255,255,.9)}
.footer{margin:0 auto;max-width:1010px;background:#f5f7f9}
@media(max-width:720px){
 .head{gap:9px}
 .brand{font-size:43px}
 .head p{font-size:10px}
 .nav .wrap{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}
 .nav button{flex:0 0 auto;padding:10px 12px;white-space:nowrap}
 .classic-modules,.classic-mail-grid{grid-template-columns:1fr}
 .classic-gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
 main.wrap{padding:13px 10px!important}
}

</style>
