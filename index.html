<style>
:root{font:14px Verdana,Arial,sans-serif;color:#323232;background:#e9e9ec}*{box-sizing:border-box}body{margin:0}a{color:#155b90;cursor:pointer}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.wrap{width:min(100%,1000px);margin:auto;padding:0 10px}.top{background:#b51e32;color:#fff;border-bottom:4px solid #871326}.head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 10px}.brand{font:bold 54px Arial;color:white;letter-spacing:-5px;text-shadow:0 2px #862035}.brand span{color:#ffbcd1}.head p{font-size:12px;margin:0}.nav{background:linear-gradient(#669bc4,#2f6595);border-bottom:3px solid #244d73}.nav .wrap{display:flex;flex-wrap:wrap}.nav button{background:none;border:0;color:white;padding:12px 17px;font-weight:bold;border-right:1px solid #8bb5d1}.nav button:hover{background:#265582}main{padding:18px 10px!important;min-height:67vh}.panel{background:white;border:1px solid #ccc;margin:0 0 15px}.panel h2,.panel h3{margin:0;background:linear-gradient(#dc3d62,#a52144);color:white;font-size:15px;padding:9px 12px}.body{padding:14px}.muted{font-size:12px;color:#6c6c6c}.cols{display:grid;grid-template-columns:265px minmax(0,1fr);gap:16px}.item{border-bottom:1px solid #e6e6e6;padding:10px 0;overflow-wrap:anywhere}.item:last-child{border:0}.button{padding:9px 15px;background:#3273a6;border:1px solid #1c517d;color:white;font-weight:bold;border-radius:3px;margin:3px 4px 3px 0}.button.secondary{background:#f3f5f7;color:#225a87;border-color:#bccbd6}.button.danger{background:#a02840}.fields{display:grid;gap:11px}.fields label{display:grid;gap:5px;font-weight:bold}.fields input,.fields textarea,.fields select,.field{width:100%;padding:9px;border:1px solid #b6bdc7;border-radius:2px;background:white;color:#272727}.fields textarea{min-height:80px}.notice{background:#fff5d4;padding:12px;margin-bottom:16px;border:1px solid #e5ce88}.good{background:#e4f6e6;border-color:#a9d2ae}.bad{background:#fbe3e6;border-color:#e3a6aa}.profile-art{padding:22px;text-align:center;background:var(--banner,linear-gradient(120deg,#ffb9d0,#d32f69,#702857));color:white;font-size:24px;font-weight:bold;min-height:112px;text-shadow:0 1px 2px #222}.avatar{height:116px;width:116px;object-fit:cover;border:3px solid white;box-shadow:0 0 0 1px #bbb;background:#efbfd6;margin:auto;display:grid;place-items:center;font-size:43px;font-weight:bold;color:#872f54}.friends{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}.friend{padding:8px 3px;border:1px solid #eee;font-size:12px;overflow-wrap:anywhere}.friend img{width:48px;height:48px;object-fit:cover}.skin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.skin{border:1px solid #ccc;background:white;text-align:left;padding:5px}.swatch{height:75px;margin-bottom:8px}.actions{display:flex;gap:4px;flex-wrap:wrap;align-items:center}.small{font-size:12px}.footer{padding:20px;text-align:center;font-size:12px;color:#666}.hidden{display:none!important}.hero{max-width:580px;margin:20px auto}.status{min-height:18px;margin:10px 0;color:#a0203b;overflow-wrap:anywhere}.status.ok{color:#176637}.inlineform{display:flex;gap:7px;flex-wrap:wrap}.inlineform .field{flex:1;min-width:150px}.photo{width:95px;height:95px;object-fit:cover;border:2px solid #fff;box-shadow:0 0 0 1px #bbb}@media(max-width:700px){.cols{grid-template-columns:1fr}.head{align-items:flex-start}.brand{font-size:44px}.nav button{padding:10px}.friends{grid-template-columns:repeat(4,minmax(0,1fr))}.hero{margin:0 auto}}
/* Compact 2000s modules, responsive to mouse and touch. */
.retro-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px}
.top16{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.top-slot{border:1px solid #e5c7d4;padding:5px 2px;text-align:center;font-size:11px;min-width:0}
.top-slot a{display:block;overflow-wrap:anywhere}
.top-initial{display:grid;place-items:center;width:38px;height:38px;background:#dba1c5;color:#692247;font-size:21px;font-weight:bold;margin:2px auto 5px;border:2px solid white;outline:1px solid #cc9bba}
.top-slot button{padding:2px 5px;font-size:11px;margin:0}
.big-luv{color:#ae1e4f;font-size:21px;font-weight:bold}
.drawing-tools{display:flex;align-items:center;gap:12px}
.drawing-tools label{display:flex;gap:8px;align-items:center}
#bebo-draw,.drawing-preview{display:block;width:100%;max-width:450px;height:auto;aspect-ratio:5/2;background:white;border:2px solid #bd7390;touch-action:none}
.drawing-preview{border:1px solid #ddd;margin:8px 0;pointer-events:none}
.video-frame{position:relative;width:100%;aspect-ratio:16/9}
.video-frame iframe{width:100%;height:100%;border:0}
audio{width:100%;max-width:100%}
.quiz-option{padding:7px;border-bottom:1px dashed #ddd}
.correct{color:green;font-weight:bold}
.wrong{color:#ab2040;font-weight:bold}
.longtext{white-space:pre-wrap;overflow-wrap:anywhere}
.retro-feed{display:grid;gap:8px}
@media(max-width:700px){.retro-grid{grid-template-columns:1fr}.top16{grid-template-columns:repeat(4,minmax(0,1fr))}.top-slot .actions{justify-content:center}}
</style>
