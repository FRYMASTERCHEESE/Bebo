name: Bebo Safe Pre-Launch Browser Test
on:
  push:
    paths:
      - 'index.html'
      - 'videos.js'
      - 'tests/videos-smoke.mjs'
      - 'social.js'
      - 'verified.js'
      - 'safety.js'
      - 'admin.js'
      - 'admin-advanced.js'
      - 'classic-modules.js'
      - 'nostalgia.js'
      - 'skin-library.js'
      - 'skin-studio.js'
      - 'suggestions.js'
      - 'tests/suggestions-smoke.mjs'
      - 'tests/skin-studio-smoke.mjs'
      - 'config.js'
      - 'tests/smoke-browser.mjs'
      - 'tests/verified-smoke.mjs'
      - 'tests/profile-verified-smoke.mjs'
      - 'tests/verified-transparency-smoke.mjs'
      - '.github/workflows/bebo-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-smoke:
    name: Test public Bebo routes without writing data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Bebo source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Test Bebo Videos permissions and rendering using mock members
        run: node tests/videos-smoke.mjs
      - name: Test private Bebo suggestions, admin review and escaping
        run: node tests/suggestions-smoke.mjs
      - name: Test Skin Studio design safety and private drafts
        run: node tests/skin-studio-smoke.mjs
      - name: Test Bebo Verified badges and ranking without using real accounts
        run: node tests/verified-smoke.mjs
      - name: Test Verified button and application placement on member profiles
        run: node tests/profile-verified-smoke.mjs
      - name: Test verified transparency and badge information safely
        run: node tests/verified-transparency-smoke.mjs
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile and desktop read-only smoke tests
        run: node tests/smoke-browser.mjs
      - name: Keep audit results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bebo-public-smoke-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
